<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Near Ex - Drive</title>
  <link rel="stylesheet" href="style.css">
  <meta name="color-scheme" content="light">
  <style>
    :root { color-scheme: light; } /* stops the browser's forced dark mode from washing out the file list */
    .app-body { overflow: hidden; background: #fff; }
    iframe { display: block; width: 100%; height: 100%; border: none; background: #fff; }
  </style>
</head>
<body data-page="drive">
  <div class="app-wrapper">
    <header class="app-header">
      <div class="brand">
        <img src="eleven.png" alt="" onerror="this.style.display='none'">
        <div><h1>NEAR EX</h1><span>Drive Files</span></div>
      </div>
      <div class="pill">Drive</div>
    </header>
    <div class="app-body">
      <a class="fab" href="portal.html" aria-label="Back to portal" title="Back to portal">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
      </a>
      <iframe title="Google Drive folder" src="https://drive.google.com/embeddedfolderview?id=1TrfMdfeikFRLn8vnx3I1Uu5PlfRmG_vI#list"></iframe>
    </div>
  </div>
  <script src="script.js" defer></script>
</body>
</html>
